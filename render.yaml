services:
  - type: web
    name: rag-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: ANTHROPIC_API_KEY
        sync: false
